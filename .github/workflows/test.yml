name: tests

on:
  push:
    branches: [ main, master, paper-reproduction ]
  pull_request:
    branches: [ main, master, paper-reproduction ]

jobs:
  pytest:
    name: pytest (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install agentrx (editable) + test runner
        # The test suite is fully offline (no network, no LLM calls); the
        # heavy plotting / openai deps are still required because importing
        # agentrx.judge.judge pulls them in at module load.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: pytest
        # testpaths/addopts come from pyproject.toml [tool.pytest.ini_options].
        run: pytest
