[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentrx"
version = "0.1.0"
description = "AgentRx – Agentic trajectory analysis pipeline for invariant checking and LLM-as-a-Judge evaluation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
agentrx = "agentrx.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["agentrx*"]

[tool.setuptools.package-data]
agentrx = ["**/*.json", "**/*.txt"]

[tool.pytest.ini_options]
# Single source of truth for the test layout: `pytest` invoked from the
# repo root (no arguments) discovers exactly the suite that CI runs.
testpaths = ["tests"]
# Ignore stray pyc/cached bytecode in untracked dirs (runs/, trajectories/)
# so test collection is reproducible across machines.
norecursedirs = ["runs", "trajectories", "data", "third_party", "scripts/__pycache__"]
addopts = "-ra"
